[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-repository-mcp-server"
version = "0.1.0"
description = "Minimal local-only MCP server for a private portfolio repository"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0.0",
  "mcp>=1.0.0",
  "fastapi>=0.115.0",
]

[project.scripts]
portfolio-mcp-server = "server:main"

[tool.setuptools]
package-dir = {"" = "server/src"}

[tool.setuptools.packages.find]
where = ["server/src"]
